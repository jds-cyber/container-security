---
name: Container Security Scan

on:
  push:
    branches:
      - main
      - container-security

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: pywinrm-ansible:dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "$IMAGE_NAME" .

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v3

      - name: Scan container image
        run: |
          mkdir -p reports/latest
          grype "$IMAGE_NAME" \
            -o json \
            > reports/latest/report.json

      - name: Generate security summary
        id: summarize
        run: |
          set +e

          ./scripts/summarize.py \
            reports/latest/report.json \
            > reports/latest/summary.json

          SUMMARY_EXIT=$?

          echo "summary_exit=$SUMMARY_EXIT" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Generate HTML report
        if: always()
        run: |
          if [ -s reports/latest/summary.json ]; then
            ./scripts/report.py \
              reports/latest/summary.json \
              reports/latest/report.html \
              "$IMAGE_NAME"
          else
            echo "No valid security summary was generated."
            exit 1
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-report
          path: |
            reports/latest/report.json
            reports/latest/summary.json
            reports/latest/report.html
          if-no-files-found: warn

      - name: Enforce security policy
        if: always()
        run: |
          if [ "${{ steps.summarize.outputs.summary_exit }}" != "0" ]; then
            echo "Security policy failed."
            exit 1
          fi

          echo "Security policy passed."
