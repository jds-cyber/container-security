---
name: Container Security Scan

on:
  push:
    branches:
      - main
      - container-security

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: pywinrm-ansible:dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "$IMAGE_NAME" .

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v3

      - name: Scan container image
        run: |
          mkdir -p reports/latest
          grype "$IMAGE_NAME" \
            -o json \
            > reports/latest/report.json

      - name: Generate security summary
        id: summarize
        run: |
          set +e

          ./scripts/summarize.py \
            reports/latest/report.json \
            > reports/latest/summary.json

          SUMMARY_EXIT=$?

          echo "summary_exit=$SUMMARY_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$SUMMARY_EXIT" -eq 0 ]; then
            POLICY_STATUS="✅ PASSED"
          else
            POLICY_STATUS="❌ FAILED"
          fi

          export POLICY_STATUS

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path("reports/latest/summary.json").read_text()
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("# Container Security Scan\n\n")
              f.write(
                  f"## Policy Status: "
                  f"{os.environ['POLICY_STATUS']}\n\n"
              )

              if summary.get("policy_failures"):
                  f.write("### Policy Failures:\n\n")

                  for failure in summary["policy_failures"]:
                      f.write(f"- ❌ {failure}\n")

                  f.write("\n")
              else:
                  f.write("No policy failures detected.\n\n")

              f.write("| Metric | Value |\n")
              f.write("|---|---:|\n")
              f.write(f"| Findings | {summary['findings']} |\n")
              f.write(
                  f"| Unique vulnerabilities | "
                  f"{summary['unique_vulnerabilities']} |\n"
              )
              f.write(f"| Critical | {summary['critical']} |\n")
              f.write(f"| High | {summary['high']} |\n")
              f.write(f"| Medium | {summary['medium']} |\n")
              f.write(f"| Low | {summary['low']} |\n")
              f.write(f"| Negligible | {summary['negligible']} |\n")
              f.write(f"| Unknown | {summary['unknown']} |\n")
              f.write(
                  f"| Weighted risk | "
                  f"{summary['weighted_risk']} |\n"
              )
              f.write(
                  f"| Security score | "
                  f"{summary['security_score']} |\n"
              )
              f.write(f"| Grade | {summary['grade']} |\n")
              f.write(
                  f"| Risk level | "
                  f"{summary['risk_level']} |\n"
              )
          PY

          exit 0

      - name: Generate HTML report
        if: always()
        run: |
          if [ -s reports/latest/summary.json ]; then
            ./scripts/report.py \
              reports/latest/summary.json \
              reports/latest/report.html \
              "$IMAGE_NAME"
          else
            echo "No valid security summary was generated."
            exit 1
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-report
          path: |
            reports/latest/report.json
            reports/latest/summary.json
            reports/latest/report.html
          if-no-files-found: warn

      - name: Enforce security policy
        if: always()
        run: |
          if [ "${{ steps.summarize.outputs.summary_exit }}" != "0" ]; then
            echo "Security policy failed."
            exit 1
          fi

          echo "Security policy passed."
