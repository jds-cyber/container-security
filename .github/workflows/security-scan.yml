name: Container Security Scan

on:
  push:
    branches:
      - main
      - container-security

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: pywinrm-ansible:dev

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Build image
        run: |
          docker build -t "$IMAGE_NAME" .

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v3

      - name: Scan container image
        run: |
          mkdir -p reports/latest
          grype "$IMAGE_NAME" \
            -o json \
            > reports/latest/report.json

      - name: Generate security summary
        if: always()
        run: |
          if [ -f reports/latest/report.json ]; then
            ./scripts/summarize.py \
              reports/latest/report.json \
              > reports/latest/summary.json
          fi

      - name: Generate HTML report
        if: always()
        run: |
          if [ -f reports/latest/summary.json ]; then
            ./scripts/report.py \
              reports/latest/summary.json \
              reports/latest/report.html \
              "$IMAGE_NAME"
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-report
          path: |
            reports/latest/report.json
            reports/latest/summary.json
            reports/latest/report.html
          if-no-files-found: warn
